<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lift&Move — Admin</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0b14;
      --surface:   #13131e;
      --border:    #232336;
      --accent:    #6C4FF6;
      --accent2:   #b94cf0;
      --teal:      #38c8c0;
      --pink:      #e8527a;
      --text:      #eceaf5;
      --muted:     #6b6b88;
      --error:     #e8527a;
      --radius:    16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo con blobs animados */
    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 520px; height: 520px; background: var(--accent); top: -120px; left: -80px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -80px; right: -60px; animation-delay: -4s; }
    .blob-3 { width: 260px; height: 260px; background: var(--teal); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; opacity: 0.1; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* Card */
    .card {
      background: rgba(19, 19, 30, 0.85);
      border: 1px solid rgba(108, 79, 246, 0.2);
      border-radius: 28px;
      padding: 52px 48px;
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(108,79,246,0.08), 0 40px 100px rgba(0,0,0,0.55);
      animation: slideUp 0.55s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Línea decorativa superior */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 48px; right: 48px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
      border-radius: 0 0 4px 4px;
    }

    /* Logo */
    .logo-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      letter-spacing: 3px;
      background: linear-gradient(130deg, var(--accent) 0%, var(--accent2) 55%, var(--teal) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .logo-badge {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 400;
      margin-bottom: 40px;
      letter-spacing: 0.4px;
    }

    /* Fields */
    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.9rem; pointer-events: none; opacity: 0.5;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px 13px 40px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      background: rgba(108,79,246,0.06);
      box-shadow: 0 0 0 3px rgba(108,79,246,0.14);
    }
    input::placeholder { color: var(--muted); opacity: 0.6; }

    /* Botón */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(130deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 22px rgba(108,79,246,0.35);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(rgba(255,255,255,0.12), transparent);
      border-radius: inherit;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 30px rgba(108,79,246,0.45); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    /* Error */
    .error-box {
      background: rgba(232,82,122,0.08);
      border: 1px solid rgba(232,82,122,0.25);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.83rem;
      color: var(--error);
      margin-top: 18px;
      display: flex; align-items: center; gap: 8px;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divisor */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0 0;
      font-size: 0.72rem; color: var(--muted); letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div id="app">
    <div class="card">
      <div class="logo-row">
        <div class="logo">Lift&Move</div>
        <div class="logo-badge">Admin</div>
      </div>
      <div class="subtitle">Panel de administración · Acceso restringido</div>

      <form @submit.prevent="login">
        <div class="field">
          <label>Usuario</label>
          <div class="input-wrap">
            <span class="input-icon"></span>
            <input type="text" v-model="nombreUsu" placeholder="Nombre de usuario"
              autocomplete="username" :disabled="cargando"/>
          </div>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="input-wrap">
            <span class="input-icon"></span>
            <input type="password" v-model="contrasenha" placeholder="••••••••"
              autocomplete="current-password" :disabled="cargando"/>
          </div>
        </div>

        <button class="btn" type="submit" :disabled="cargando">
          <span v-if="cargando"><span class="spinner"></span>Verificando acceso...</span>
          <span v-else>Iniciar sesión</span>
        </button>
      </form>

      <div class="error-box" v-if="error">
        <span></span> {{ error }}
      </div>

      <div class="divider">Solo administradores autorizados</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          nombreUsu: '',
          contrasenha: '',
          error: '',
          cargando: false
        };
      },

      mounted() {
        if (localStorage.getItem('token')) {
          window.location.href = 'panel.html';
        }
      },

      methods: {
        async login() {
          if (!this.nombreUsu || !this.contrasenha) {
            this.error = 'Completa todos los campos.';
            return;
          }

          this.cargando = true;
          this.error = '';

          try {
            const respuesta = await fetch(`${API_URL}/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                nombreUsu: this.nombreUsu,
                contrasenha: this.contrasenha
              })
            });

            const datos = await respuesta.json();

            if (!respuesta.ok) {
              throw new Error(datos.detail || 'Credenciales incorrectas.');
            }

            if (!datos.esAdmin) {
              throw new Error('No tienes permisos de administrador.');
            }

            localStorage.setItem('token', datos.access_token);
            localStorage.setItem('nombreUsu', datos.nombreUsu);
            window.location.href = 'panel.html';

          } catch (err) {
            this.error = err.message;
          } finally {
            this.cargando = false;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
