<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lift&Move — Admin</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --surface: #16161f;
      --border: #2a2a3a;
      --accent: #7c5cfc;
      --accent2: #c45cfc;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --error: #fc5c7c;
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,92,252,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(196,92,252,0.13) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,92,252,0.08);
      animation: slideUp 0.5s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 400;
      margin-bottom: 36px;
      letter-spacing: 0.5px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-box {
      background: rgba(252,92,124,0.1);
      border: 1px solid rgba(252,92,124,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: var(--error);
      margin-top: 16px;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <div class="logo">Lift&Move</div>
      <div class="subtitle">Panel de administración</div>

      <form @submit.prevent="login">
        <div class="field">
          <label>Usuario</label>
          <input
            type="text"
            v-model="nombreUsu"
            placeholder="Nombre de usuario"
            autocomplete="username"
            :disabled="cargando"
          />
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input
            type="password"
            v-model="contrasenha"
            placeholder="••••••••"
            autocomplete="current-password"
            :disabled="cargando"
          />
        </div>

        <button class="btn" type="submit" :disabled="cargando">
          <span v-if="cargando"><span class="spinner"></span>Ingresando...</span>
          <span v-else>Iniciar sesión</span>
        </button>
      </form>

      <div class="error-box" v-if="error">{{ error }}</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          nombreUsu: '',
          contrasenha: '',
          error: '',
          cargando: false
        };
      },

      mounted() {
        // Si ya hay token guardado, ir directo al panel
        if (localStorage.getItem('token')) {
          window.location.href = 'panel.html';
        }
      },

      methods: {
        async login() {
          if (!this.nombreUsu || !this.contrasenha) {
            this.error = 'Completa todos los campos.';
            return;
          }

          this.cargando = true;
          this.error = '';

          try {
            const respuesta = await fetch(`${API_URL}/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                nombreUsu: this.nombreUsu,
                contrasenha: this.contrasenha
              })
            });

            const datos = await respuesta.json();

            if (!respuesta.ok) {
              throw new Error(datos.detail || 'Credenciales incorrectas.');
            }

            // Verificar que sea admin
            if (!datos.esAdmin) {
              throw new Error('No tienes permisos de administrador.');
            }

            localStorage.setItem('token', datos.access_token);
            localStorage.setItem('nombreUsu', datos.nombreUsu);
            window.location.href = 'panel.html';

          } catch (err) {
            this.error = err.message;
          } finally {
            this.cargando = false;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
